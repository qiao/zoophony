<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoophony audio spike</title>
  </head>
  <body>
    <h1>Audio spike</h1>
    <p>
      This page plays the Beethoven 9 demo with the <code>Player</code> (design 9.5, step 1). The
      query <code>?demo=&lt;id&gt;</code> selects another demo. It shows the values of the step 1
      checks. Each value is also in <code>window.spike</code>.
    </p>
    <p>
      <button id="play" type="button" disabled>Play</button>
      <button id="pause" type="button" disabled>Pause</button>
      <label>Seek to <input id="seek-input" type="number" min="0" step="1" value="60" /> s</label>
      <button id="seek" type="button" disabled>Seek</button>
      <button id="resume" type="button">Resume the audio context only</button>
    </p>
    <table>
      <tbody id="values"></tbody>
    </table>
    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
