# The props of the gallery (python3 studio props <animal>): one prop of each kind of the library,
# sized from the body of the animal in a seated bind pose. Each table has the fields of a prop of
# a role pack ([[props]] of role.toml, see "Role pack reference" in README.md). The gallery shows
# each prop on its own, so the places of the scene props do not matter here.

[[props]]
name = "piano"
kind = "piano"
attach = { bone = "scene" }
piano = { keys_front = 0.30 }
material = { roughness = 0.3, specular = 0.6 }

[[props]]
name = "bench"
kind = "bench"
attach = { bone = "scene", seat_height = "legs" }
bench = {}
material = { roughness = 0.6, specular = 0.3 }

[[props]]
name = "chair"
kind = "chair"
attach = { bone = "scene", seat_height = "legs" }
chair = {}
material = { roughness = 0.6, specular = 0.3 }

[[props]]
name = "music_stand"
kind = "music_stand"
attach = { bone = "scene" }
stand = {}
material = { roughness = 0.5, specular = 0.4 }

[[props]]
name = "violin"
kind = "violin"
attach = { bone = "scene" }
strings = { lean = 0.0 }
material = { roughness = 0.35, specular = 0.6 }

[[props]]
name = "violin_bow"
kind = "bow"
attach = { bone = "hand", side = "R" }
grip = [0.0, 0.03, 0.02]
direction = [0.0, 0.2, -1.0]
strings = { bow_for = "violin" }
material = { roughness = 0.4, specular = 0.5 }
cast_shadow = false

[[props]]
name = "cello"
kind = "cello"
attach = { bone = "scene" }
strings = { lean = 0.0, colors = { wood = [126, 63, 31], top = [184, 98, 46] } }
material = { roughness = 0.35, specular = 0.6 }

[[props]]
name = "cello_bow"
kind = "bow"
attach = { bone = "hand", side = "R" }
grip = [0.0, 0.03, 0.02]
direction = [0.0, 0.2, -1.0]
strings = { bow_for = "cello" }
material = { roughness = 0.4, specular = 0.5 }
cast_shadow = false
