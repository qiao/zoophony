# The Rabbit: the config of the animal "rabbit". `python3 studio new rabbit --like polar-bear`
# wrote it from animals/polar-bear/animal.toml (with its comments) and the measures of the new sheet
# (the fields marked "measured"). Each other value is a start from polar-bear: measure it on this sheet
# with `python3 studio fit` (the field) and `python3 studio calibrate` (the light, the palette,
# the color classes). `python3 studio schema` explains each field.
#
# Units: the animal is 1 unit tall, from the soles to the tops of the ears. Axes of three.js
# and glTF: x is the left of the animal, y is up, z is forward. Colors are sRGB 0..255. Angles
# are in degrees.

[animal]
id = "rabbit"
name = "Rabbit"
template = "biped"
role = "violinist"

# The reference sheet: four views of one pose on one plain background.
[sheet]
image = "reference/rabbit-views.png"
background = [204, 204, 206]  # measured by studio new
foreground = { min_saturation = 14, max_dark_sum = 390 }

[sheet.views.front]
columns = [0, 415]  # measured by studio new
azimuth = 0.0
label = "Front"

[sheet.views.side]
columns = [415, 745]  # measured by studio new
azimuth = 90.0
label = "Side"
axis = "shin"

[sheet.views.back]
columns = [745, 1162]  # measured by studio new
azimuth = 180.0
label = "Back"
flip = true

[sheet.views.three_quarter]
columns = [1162, 1536]  # measured by studio new
azimuth = 38.0
label = "3/4"

[sheet.camera]
distance = 10.0
height = 0.5
fov = 7.4

# The masks of the sheet views: a figure pixel differs from the measured background color.
[intake]
foreground = "difference"

# The body field: measured parts that blend into one signed distance field.
[field]
step = 0.004

[field.trunk]
heights = [0.145, 0.640, 0.005]
width_measured_to = 0.39
width_measure_floor = 0.15
width_points = [[0.42, 0.095], [0.46, 0.090], [0.50, 0.083], [0.53, 0.075], [0.56, 0.067], [0.60, 0.058], [0.64, 0.045]]
side_measure_floor = 0.27
front_measured_to = 0.52
front_points = [[0.55, 0.11], [0.58, 0.10], [0.62, 0.07], [0.64, 0.05]]
smooth = 0.010
bottom_cap = [0.05, 0.14]
top_cap = 0.04
top_cap_min = 0.05
widest = [[0.15, 0.35], [0.3, 0.40], [0.45, 0.45]]
front_power = [[0.15, 2.0], [0.45, 2.1], [0.6, 2.2]]
back_power = 2.35
box = [[-0.17, 0.11, -0.18], [0.17, 0.66, 0.19]]

[field.head]
bottom = 0.548
cheek = [0.615, 0.106]
temple = 0.70
width_points = [[0.615, 0.108], [0.635, 0.110], [0.65, 0.104], [0.66, 0.098], [0.68, 0.087], [0.70, 0.081]]
cap = 0.70
top = 0.77
blend = 0.018
step = 0.0025
face_points = [[0.548, 0.05], [0.565, 0.09], [0.58, 0.12], [0.60, 0.165], [0.62, 0.168], [0.64, 0.174], [0.66, 0.176], [0.68, 0.176], [0.70, 0.172]]
face_join = 0.71
forehead_top = 0.75
dome_front = 0.06
back_points = [[0.555, 0.0], [0.58, -0.02], [0.62, -0.04], [0.66, -0.05], [0.70, -0.042]]
back_join = 0.71
back_top = 0.74
dome_back = 0.04
smooth = 0.004
front_power = 2.0
back_power = 2.1
widest = 0.5
