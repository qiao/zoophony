crotch = { half_x = [0.045, 0.02], top = [0.15, 0.02], low = [0.09, 0.015], keel_x = [0.022, 0.01], keel_y = [0.07, 0.015] }
head = { muzzle_scale = 1.25, skull = { center = [0.0, 0.665, 0.06], radii = [0.11, 0.1, 0.11] }, skull_from_y = [0.6, 0.03] }

[rig.weights.trunk]
head_from_y = [0.555, 0.04]
legs = { thigh_top = 0.2, shin_top = 0.13, radius = 0.08, ramp = 0.03, top_ramp = 0.035 }
below = [0.11, 0.015]
crotch = { half_x = [0.045, 0.025], top = [0.16, 0.03] }

[rig.clavicle]
