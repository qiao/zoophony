[details.ears]
# A blade loft: the outer edge follows an ellipse, the inner edge comes in toward a pointed tip,
# and a narrow pink slot runs near the outer edge with a wide cream band on the inner edge. The
# rings follow the ear rows and the pink rows of the front view of the sheet (y 0.78 to 0.99).
# tip_x keeps the top of the ear at y 0.99373, because the renders scale the model to its top.
blade = [[-1.0, 0.425, -0.025],
         [-0.75, 0.64, -0.02],
         [-0.5, 0.795, -0.005],
         [-0.25, 0.89, 0.01],
         [0.0, 0.915, 0.015],
         [0.25, 0.87, 0.01],
         [0.45, 0.76, 0.02],
         [0.62, 0.61, 0.03],
         [0.77, 0.45, 0.03],
         [0.9, 0.26, 0.02]]
tip_x = -0.1283
blade_columns = [-1.0, -0.88, -0.35, 0.15, 0.7, 1.0]
blade_front = [0.2, 1.3, 1.0, 1.0, 0.7, 0.6]
slot_columns = [2, 4]
slot_rows = [-0.75, 0.9]
slot_depth = 1.5
