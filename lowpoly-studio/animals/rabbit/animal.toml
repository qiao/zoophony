# The left arm in the pose of the sheet (the "reference" pose). For a violin of 28 cm, the upper arm
# and the forearm are 1.444 times the sheet arm along the directions of the sheet (sheet: elbow
# [0.14, 0.40, 0.035], wrist [0.200, 0.335, 0.06]), so the reach from the shoulder joint to the
# middle of the palm is 1.40 times (0.2247 to 0.3146). The clavicle, the shoulder joint, and the paw
# (the knuckle - wrist offset) do not change.
[field.arm.joints]
clavicle = [0.02, 0.50, 0.02]
shoulder = [0.07, 0.485, 0.025]
elbow = [0.1711, 0.3623, 0.0394]
wrist = [0.2577, 0.2684, 0.0755]
knuckle = [0.2697, 0.2284, 0.0905]

[field.arm]
palm = [-0.86, 0.0, -0.51]
upper = { radii = [0.030, 0.027], squash = 1.15, blend = 0.02, box_pad = 0.07 }
deltoid = { center = [0.01, -0.035, 0.0], radii = [0.028, 0.034, 0.03], blend = 0.018, box_pad = 0.06 }
forearm = { radii = [0.027, 0.023], blend = 0.016, box_pad = 0.06 }
forearm_bulge = { center = [0.004, 0.022, 0.002], radii = [0.025, 0.025, 0.026], blend = 0.014, box_pad = 0.05 }
paw = { radii = [0.026, 0.03, 0.022], blend = 0.012, box_pad = 0.06 }

[field.leg.joints]
hip = [0.075, 0.20, 0.0]
knee = [0.075, 0.12, 0.0]
ankle = [0.077, 0.05, -0.02]
ball = [0.085, 0.022, 0.068]
toe = [0.085, 0.018, 0.098]

[field.leg]
thigh = { radii = [0.05, 0.04], squash = 1.14, blend = 0.035, box_pad = 0.11 }
shin = { radii = [0.026, 0.024], squash = 1.18, blend = 0.02, box_pad = 0.09 }
foot = { center = [0.081, 0.02, 0.024], radii = [0.036, 0.035, 0.076], sole_blend = 0.01, blend = 0.02, box_pad = 0.09 }

[field.leg.toes]
x = 0.085
offsets = [-0.027, -0.009, 0.009, 0.027]
spread = 0.95
y = 0.015
z = 0.08
z_drop = 0.35
radii = [0.011, 0.012, 0.015]
sole_blend = 0.005
blend = 0.008
box_pad = 0.04

# The low-poly facets: the remesh and the organic pass.
[facets]
quads = 780
seeds = [3, 1, 5, 6, 2, 4, 7, 8]
offset = 0.0015
squeeze = { factor = 0.78, center = [0.0, 0.30, 0.02], radii = [0.2, 0.17, 0.2] }
collapse_share = 0.3
flip_share = 0.8
relax = 0.12
relax_rounds = 3
jitter = 0.005

# The quad band of the polar bear (30% of facets.quads). On the rabbit the seeds give 648 to 808
# quads at the target 780, inside the band.
[facets.gate]
quads = 0.3

[[facets.warps]]
center = [0.0, 0.30, 0.02]
radius = 0.17
factor = 0.72

[[facets.warps]]
center = [0.0, 0.67, 0.07]
radius = 0.12
factor = 1.5

[[facets.warps]]
center = [0.0, 0.635, 0.15]
radius = 0.07
factor = 2.6

[[facets.warps]]
center = [0.083, 0.025, 0.02]
radius = 0.075
factor = 1.8
mirror = true

[[facets.warps]]
at = "paw"
radius = 0.045
factor = 1.7
mirror = true

[[facets.warps]]
center = [0.075, 0.49, 0.025]
radius = 0.045
factor = 1.6
mirror = true

[facets.protect]
joints = { shoulder = 0.06, elbow = 0.05, wrist = 0.04 }
box = { half_x = 0.06, y = [0.03, 0.15] }
near = { part = "snout", within = 0.01 }

# The colors of the faces and of the details.
[paint.palette]
fur = [220, 208, 192]
belly = [236, 228, 214]
muzzle = [226, 216, 200]  # python3 studio calibrate (rabbit GLB)
ear = [217, 205, 190]  # python3 studio calibrate (rabbit GLB)
