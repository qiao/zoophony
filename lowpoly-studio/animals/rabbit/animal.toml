max = 15.0
lift = [0.45, 0.1]

# The look of the renders and of the viewer: the soft studio light of the sheet.
[look]
materials = { fur = { roughness = 0.7, specular = 0.35 }, gloss = { roughness = 0.42, specular = 0.5 } }

[look.light]
hemi = 3.85  # python3 studio calibrate (rabbit GLB)
key = 0.1
fill = 0.6
rim = 0.35
key_dir = [-1.2, 3.5, 3.5]
fill_dir = [3.0, 0.5, 4.0]
rim_dir = [4.0, 2.5, -6.0]
sky = [251, 250, 248]
ground = [196, 186, 178]
key_color = [255, 251, 244]
fill_color = [246, 246, 248]
rim_color = [232, 238, 255]
center_y = 0.45
shadow = 0.2

# The compare of the renders with the sheet.
[compare]
rows = [130, 840]  # measured by studio new
# The 3/4 view of the sheet turns the head toward the camera more than the body. The compare
# render turns the head in this range and keeps the best IoU.
head_turn = { three_quarter = [0.0, 18.0] }
fur_band = [0.15, 0.55]
head_share = 0.3
fur_min_saturation = 0.04

[compare.facet_crops]
chest_belly = [-0.15, 0.2, 0.15, 0.52]
shoulder_arm = [-0.25, 0.28, -0.05, 0.52]
head = [-0.13, 0.55, 0.13, 0.79]

# The measures of the features and of the facet shading, on the sheet and on the renders
# (studio/measure_features.py, studio/measure_shading.py).
[measure]
mesh_belly = [-0.1, 0.2, 0.1, 0.4]

# The pixel color classes of the features. The background of the sheet is [205, 205, 208].
[measure.classes]
dark = { max_under = 129 }  # python3 studio calibrate (rabbit GLB)
ear_dark = { median_under = 0.8 }
# The pink of the inner ear: the hue and the saturation of paint.palette.ear_inner. The cream fur
# (saturation 0.13) stays out, and a strong pink (237, 168, 145) stays in.
ear_inner = { palette = "ear_inner", hue_tol = 20.0, saturation_tol = 0.12 }
nose = { palette = "nose", saturation_tol = 0.12 }
claw = { palette = "claw", saturation_tol = 0.12, max_under = 185 }
light = { median_over = 1.12 }

# The eyes: the two dark blobs in the band of the eyes. The white rim of the sheet has the color
# of the lit cream fur (253, 248, 224 on both), so no color class can find the rim, and the eyes
# have no rim check. The eyes are 10 px wide on the sheet: the pixel floor of the checks
# (checks.feature_pixels) allows 1 px more than the outline limit of 0.08.
[measure.features.eyes]
method = "blobs"
classes = ["dark"]
min_area = 10
max_area = 800
count = 2
regions = { front = [-0.12, 0.64, 0.12, 0.70], three_quarter = [-0.12, 0.64, 0.2, 0.72] }
checks = { outline = { measure = "width", op = "rel<=", limit = 0.08 }, y = { op = "abs<=", limit = 0.01 } }

# The ears: the bumps of the silhouette at the top of the head, the inner ear in the front view.
# inner: the pink share of the ear in the front view (sheet 0.48 and 0.50, build 0.48). lean: the
# back edge of the ear from the vertical in the side view (sheet 9.8 degrees, build 9.5).
[measure.features.ears]
method = "bump"
dark = "ear_dark"
dark_views = ["front"]
inner = "ear_inner"
inner_views = ["front"]
lean_views = ["side"]
split = ["front", "back"]
regions = { front = [-1.0, 0.76, 1.0, 1.1], side = [-0.14, 0.79, 0.07, 1.1], back = [-1.0, 0.76, 1.0, 1.1] }
checks = { width = { op = "rel<=", limit = 0.1 }, height = { op = "rel<=", limit = 0.1 }, dark = { op = "abs<=", limit = 0.1 }, inner = { op = "abs<=", limit = 0.1 }, lean = { op = "abs<=", limit = 5.0 } }

# The nose: the largest blob of nose pixels on the snout. The 3/4 view of the sheet turns the
# head more than the other views, so the nose and the muzzle are measured in the front and side views.
[measure.features.nose]
method = "blobs"
classes = ["nose"]
regions = { front = [-0.05, 0.6, 0.05, 0.65], side = [0.14, 0.62, 0.23, 0.67] }
checks = { x = { op = "abs<=", limit = 0.01 }, y = { op = "abs<=", limit = 0.01 }, width = { op = "rel<=", limit = 0.15 }, height = { op = "rel<=", limit = 0.15 } }

# The belly: the lighter part of the trunk in the front view.
[measure.features.belly]
method = "area"
classes = ["light"]
regions = { front = [-0.13, 0.15, 0.13, 0.45] }
checks = { y = { op = "abs<=", limit = 0.03 }, width = { op = "rel<=", limit = 0.2 }, height = { op = "rel<=", limit = 0.2 } }

# The claws of the paws: the blobs of claw pixels below each paw.
[measure.features.claws]
method = "blobs"
classes = ["claw"]
min_area = 5
count = 4
split = ["front"]
regions = { front = [-0.16, 0.0, 0.16, 0.03] }
checks = { count = { op = "abs<=", limit = 1 } }

[measure.shading]
belly_box = [-0.09, 0.2, 0.09, 0.38]
belly_rows = [0.2, 0.24, 0.28, 0.32, 0.36]
belly_half_width = [0.12, 0.10, 0.30]
belly_columns = [-0.06, -0.03, 0.0, 0.03, 0.06]
belly_column_span = [0.17, 0.4]
arm_line = [[-0.11, 0.47], [-0.2, 0.33]]
arm_offsets = [-0.01, 0.0, 0.01]
direction_boxes = { belly = [-0.1, 0.2, 0.1, 0.36], chest = [-0.06, 0.42, 0.06, 0.5], arm = [-0.19, 0.35, -0.14, 0.42] }

# The limits of the checks (studio/checks.py). A gate check fails the build.
[checks]
iou = { front = 0.94, side = 0.94, back = 0.94, three_quarter = 0.91 }
body_triangles = [900, 1600]
slivers = 0.01
fur_color = [1.0, 0.02, 0.03]
facet_contrast = 0.15
feature_pixels = 1.0  # a feature length may differ by 1 px of the sheet

# The seed rule: the kept seed must pass every gate. The seed report lists the other seeds.
[seeds]
require = "kept"
