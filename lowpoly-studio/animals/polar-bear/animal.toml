# The polar bear: the config of the second animal of the low-poly studio (the pilot of
# lowpoly-studio/docs/retro/pilot-polar-bear.md). It started from the bear config
# (python3 studio new polar-bear --like bear) and holds the measures of its own sheet.
#
# Units: the animal is 1 unit tall, from the soles to the tops of the ears. Axes of three.js
# and glTF: x is the left of the animal, y is up, z is forward. Each point of the left side is
# mirrored to the right side (x -> -x). Colors are sRGB 0..255. Angles are in degrees.
#
# `python3 studio schema` prints the meaning of each field (also in README.md). A field that
# this file leaves out takes the default of the schema.

[animal]
id = "polar-bear"
name = "Polar Bear"
template = "biped"
role = "pianist"

# The reference sheet: four views of one pose on one plain background.
[sheet]
image = "reference/polar-bear-views.png"
background = [205, 205, 208]
foreground = { min_saturation = 14, max_dark_sum = 390 }

[sheet.views.front]
columns = [0, 455]
azimuth = 0.0
label = "Front"

[sheet.views.side]
columns = [455, 735]
azimuth = 90.0
label = "Side"
axis = "shin"

[sheet.views.back]
columns = [735, 1160]
azimuth = 180.0
label = "Back"
flip = true

[sheet.views.three_quarter]
columns = [1160, 1536]
azimuth = 42.0
label = "3/4"

[sheet.camera]
distance = 10.0
height = 0.5
fov = 7.4

# The body field: measured parts that blend into one signed distance field.
[field]
step = 0.004
