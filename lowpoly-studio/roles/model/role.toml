# The model role: the animal stands with straight legs, with no props and one clip.
#
# The studio builds each animal a second time with this role (the model build, in out/model/).
# The compare with the sheet and the look checks (IoU, fur color, features, facet contrast) come
# from the model build, so they do not depend on the role of the animal: a seated role
# straightens the legs of its bent bind pose for the sheet pose, and its side IoU drops. See the
# section "The model build" of README.md. An animal config does not name this role.

[role]
name = "model"
template = "biped"
stance = "standing"
doc = "Stands in a fixed standing bind pose. The model build of each animal uses it for the look checks."

# A standing bind pose with the arms raised to the middle of the range of a standing animal. The
# values are the bind values of the conductor, so a conductor build shares its model stages
# (field to organic) with the model build through the stage cache. They are fixed here: a change
# of a role does not change the model build. A bind pose in the pose of the sheet (no turns)
# gives a lower IoU on the polar bear, and on the bear only seed 6 of 8 passes its remesh gate.
[bind]
shoulder_flex = 40.0
shoulder_abduct = 10.0
elbow_flex = 25.0
correctives = ["arm_down"]

[clips]
fps = 30

[clips.notes]
reference = "The pose of the reference sheet (arms down). The compare tool uses it."

# The role has no IK clips, so it does not use these values. They are the values of the bear.
[targets]
shoulder = [0.16, 0.662, 0.015]
reach = 0.32195
