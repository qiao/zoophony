# The pianist role: a seated animal plays a grand piano. Each paw has four digits: the right paw
# plays a melody with single digits, the left paw plays chords of two digits, and the keys go down
# under the claws.
#
# A role pack is one folder under roles/: this file (the data, checked against the schema "ROLE"
# of studio/schema.py) and __init__.py (the clips as functions of time). See the section "Role
# packs" of README.md.

[role]
name = "pianist"
template = "biped"
stance = "seated"
doc = "Sits on a bench at a grand piano, plays a melody and chords, strikes a big chord, and rests."

# The bind pose: the legs bent for the seat, the arms forward between the keys (about 62 degrees)
# and the rest on the knees (about 22 degrees). The mesh is built and bound in this pose, so the
# seated clips stay near it. The thighs slope down 2 degrees and the shins stand near upright, as
# a real pianist sits. With thighs 20 degrees down, the short thighs of the polar bear hid under
# its round belly, and the bear read as almost standing at the piano in the app (user,
# 2026-10-22, docs/decisions/2026-10-22-studio-bears.md of the repository). The knees turn out
# 14 degrees: with the thighs side by side, the field leaves a slit between them, which the
# remesh gate stops.
[bind]
shoulder_flex = 42.0
shoulder_abduct = 8.0
elbow_flex = 40.0
hip_flex = 88.0
knee_flex = 88.0
hip_abduct = 14.0
correctives = ["arm_down", "legs_straight"]

# Four digits in each paw, one for each claw: single digits strike single keys.
[rig]
fingers = 4

# The bench: from behind the rump to the backs of the shins. The top of its pad follows the lowest
# points of the seated body, so the rump sinks into the middle of the pad and the thighs rest on
# its sides (templates/biped Body.seat).
[[props]]
name = "bench"
kind = "bench"
attach = { bone = "scene", seat_height = "legs" }
bench = { colors = { top = [52, 40, 36], legs = [30, 24, 22] } }
material = { roughness = 0.6, specular = 0.3 }

# The grand piano: the keyboard runs across the front of the belly, 6 cm below the elbows of the
# seated pose. A white key is as wide as the spacing of the claws, so each finger sits on its own
# key. 29 white keys from C2 to C6.
[[props]]
name = "piano"
kind = "piano"
attach = { bone = "scene" }
piano = { keys_below_elbow = 0.06, keys_front = 0.30, white_keys = 29, lid_open = 30.0, colors = { case = [24, 22, 26], white = [240, 236, 226], black = [20, 18, 20], metal = [200, 170, 90] } }
material = { roughness = 0.3, specular = 0.6 }

[clips]
fps = 30

[clips.notes]
performance = "All clips in order: ready, play two times, the big chord, rest."
reference = "The pose of the reference sheet (standing, arms down). The compare tool uses it."
ready = "Seated at the piano, both paws above the keys."
play = "Two bars at 120 bpm: the right paw plays a melody with single digits, the left paw plays chords of two digits (a loop)."
chord = "Both paws rise, strike a big chord with three digits each, and lift with the head."
rest = "The paws come down from the keys to the knees."

# The pianist makes its targets on the body of the animal (from the scene layout), so the body of
# the targets is not used. These are the values of the polar bear.
[targets]
shoulder = [0.155, 0.734, 0.015]
reach = 0.3138

[checks]
contact_depth = 0.01
contact_tests = ["paw", "forearm", "claws"]
scene_depth = 0.01
seat_gap = 0.015
hand_targets = 0.01

[review]
shots = "shots.json"
