# The violinist role: a seated animal plays the violin on the front part of a chair. The left paw
# holds the violin at the neck, with the violin between the chin and the left collarbone, and the
# right paw draws the bow square across the strings between the bridge and the fingerboard. A
# short clip stands, as the soloist of the app.
#
# A role pack is one folder under roles/: this file (the data, checked against the schema "ROLE"
# of studio/schema.py) and __init__.py (the clips as functions of time). See the section "Role
# packs" of README.md.

[role]
name = "violinist"
template = "biped"
stance = "seated"
doc = "Sits on a chair, holds the violin under the chin, bows whole and half bows on two strings, and rests."

# The bind pose: the legs of the pianist (the thighs slope down 20 degrees, the knees apart), and
# the arms in the middle of their range: forward and out, the elbows bent, between the play (the
# left paw at the neck of the violin, the right paw at the strings) and the rest on the lap.
[bind]
shoulder_flex = 40.0
shoulder_abduct = 30.0
elbow_flex = 70.0
hip_flex = 55.0
knee_flex = 55.0
hip_abduct = 16.0
correctives = ["arm_down", "legs_straight"]

# One finger bone in each paw: the app gives each paw one finger bone.
[rig]
fingers = 1

# The chair: the seat from behind the rump to the backs of the shins, fitted to the seated body.
[[props]]
name = "chair"
kind = "chair"
attach = { bone = "scene", seat_height = "legs" }
chair = { colors = { wood = [150, 112, 72] } }
material = { roughness = 0.6, specular = 0.3 }

# The violin in the left paw: the neck lies across the palm at the base of the finger, the scroll
# toward the index side, and the top plate toward the finger. The clips turn the paw so that the
# violin lies between the chin and the left collarbone. The violin touches the chin and the
# collarbone, so the contact check does not test it. The violin of the rabbit is 0.234 long: about
# 0.28 m at the scale of the app (1.198 m for each unit). That is 0.80 arm reaches.
[[props]]
name = "violin"
kind = "violin"
attach = { bone = "hand", side = "L" }
grip = [0.0, 0.008, 0.02]
direction = [-1.0, 0.0, 0.0]
strings = { length = 0.234, top = [0.0, 1.0, 0.25], neck = 0.68 }
material = { roughness = 0.35, specular = 0.6 }
contact = "none"

# The bow in the right paw: the stick across the palm, the hair toward the palm. The bow is 1.25
# violins long (the rule of the prop library).
[[props]]
name = "bow"
kind = "bow"
attach = { bone = "hand", side = "R" }
grip = [0.0, 0.01, 0.018]
direction = [-1.0, 0.15, 0.0]
strings = { length = 0.29, hair = [0.0, 0.0, 1.0], bow_for = "violin" }
material = { roughness = 0.4, specular = 0.5 }
cast_shadow = false
contact = "bow"

[clips]
fps = 30

[clips.notes]
performance = "All clips in order: ready, play two times, rest."
reference = "The pose of the reference sheet (standing, arms down). The compare tool uses it."
ready = "Seated: the violin comes up under the chin, and the bow comes onto the A string at the frog."
play = "Two bars at 120 bpm: a whole bow down and up on the A string, then half bows down and up on the D string."
rest = "The violin goes down onto the left thigh, and the bow lies across the lap."
stand_play = "Standing, as a soloist: the violin up, a short stroke down and up on the A string."

# The violinist makes its targets on the body of the animal, so the body of the targets is not
# used. These are the values of the rabbit.
[targets]
shoulder = [0.07, 0.485, 0.025]
reach = 0.29

[checks]
contact_depth = 0.01
contact_tests = ["paw", "forearm", "claws", "props"]
scene_depth = 0.01
seat_gap = 0.015

[review]
shots = "shots.json"
