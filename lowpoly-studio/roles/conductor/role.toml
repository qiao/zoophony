# The conductor role: a standing animal beats time with a baton in the right hand.
#
# A role pack is one folder under roles/: this file (the data, checked against the schema
# "ROLE" of studio/schema.py) and __init__.py (the clips as functions of time). See the section
# "Role packs" of README.md.

[role]
name = "conductor"
template = "biped"
stance = "standing"
doc = "Beats 4/4 with a baton in the right paw, cues, shapes the dynamics, and bows."

# The bind pose of the role: joint turns from the pose of the sheet. Skinning bends well only near
# the bind pose. A conductor holds the arms up most of the time, so the arms are raised to the
# middle of the conducting range.
[bind]
shoulder_flex = 40.0
shoulder_abduct = 10.0
elbow_flex = 25.0
hip_flex = 0.0
knee_flex = 0.0
correctives = ["arm_down"]

[[props]]
name = "baton"
kind = "stick"
attach = { bone = "hand", side = "R" }
tip_marker = "BatonTip"
grip = [-0.008, 0.02, 0.018]
direction = [-0.35, 1.0, -0.12]
length = 0.36
handle = { back = 0.045, steps = [0.02, 0.03], radii = [0.0085, 0.010, 0.0075], sides = 6, color = [120, 84, 52] }
shaft = { start = 0.02, middle = 0.2, radii = [0.0042, 0.0032, 0.0016], sides = 5, color = [244, 240, 230] }
material = { roughness = 0.45, specular = 0.4 }
cast_shadow = false
contact = "shaft"

[clips]
fps = 30

[clips.notes]
performance = "All gestures in order: ready, beats, cue, crescendo, hush, cutoff, bow."
reference = "The pose of the reference sheet (arms down). The compare tool uses it."
ready = "Both arms up, the baton ready."
beat_4_4 = "One bar of 4/4 at 60 bpm: down, in, out, up, with ictus and rebound."
cue_left = "The left paw cues the players on the left, the head turns to them."
crescendo = "The left palm turns up and lifts."
hush = "The left palm turns down and presses."
cutoff = "A loop and a cutoff with both paws, then a hold."
nod_turn = "A head nod and a turn to each section."
sway_dip = "A torso sway and a knee dip on each beat."
bow = "The bow at the end."

# The body that the targets of the clips were made on. On another body the wrist targets move
# with its shoulders and scale with its arm reach.
[targets]
shoulder = [0.16, 0.662, 0.015]
reach = 0.32195

[checks]
contact_depth = 0.01
contact_tests = ["paw", "forearm", "claws", "props"]

[review]
shots = "shots.json"
blender = ["pattern.py"]
