<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Props Gallery</title>
    <style>
      :root {
        --bg: #cacacb;
        --panel: rgba(250, 248, 245, 0.92);
        --ink: #2b2420;
        --muted: #6d625a;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 system-ui, sans-serif;
      }
      header {
        padding: 12px 16px 4px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 2px 0 0;
        color: var(--muted);
      }
      #main {
        display: block;
        width: 100%;
        height: 60vh;
      }
      #tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
        padding: 8px 16px 16px;
      }
      .tile {
        background: var(--panel);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .tile.on {
        border-color: #8a5a36;
      }
      .tile img {
        display: block;
        width: 100%;
      }
      .tile div {
        padding: 6px 8px;
      }
      .tile small {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Props gallery</h1>
      <p>Each prop of the library, sized from the body of the animal. Drag to turn the view. Click a tile to show its prop.</p>
    </header>
    <canvas id="main"></canvas>
    <div id="tiles"></div>
    <script type="module" src="./props.js"></script>
  </body>
</html>
