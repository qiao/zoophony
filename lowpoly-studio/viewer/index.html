<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Viewer</title>
    <style>
      :root {
        --bg: #cacacb;
        --panel: rgba(250, 248, 245, 0.92);
        --ink: #2b2420;
        --muted: #6d625a;
        --accent: #8a5a36;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 230px;
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 12px;
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      h2 {
        margin: 12px 0 6px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button {
        padding: 4px 8px;
        border: 1px solid #c9bfb6;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button.on {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      input[type='range'] {
        flex: 1;
      }
      #time {
        margin-top: 8px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      body.shot #panel {
        display: none;
      }
      @media (max-width: 600px) {
        #panel {
          top: auto;
          bottom: 8px;
          left: 8px;
          right: 8px;
          width: auto;
          max-height: 45%;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <h1 id="title">Model viewer</h1>
      <h2>Views of the sheet</h2>
      <div class="row" id="views"></div>
      <h2>Motions</h2>
      <div class="row" id="clips"></div>
      <h2>Playback</h2>
      <label>Tempo <input id="tempo" type="range" min="30" max="160" value="72" /><span id="tempoOut"></span></label>
      <label><input id="loop" type="checkbox" checked /> Loop</label>
      <label><input id="pause" type="checkbox" /> Pause</label>
      <h2>Show</h2>
      <label id="trailRow"><input id="trail" type="checkbox" checked /> Prop tip path</label>
      <label><input id="bones" type="checkbox" /> Bones</label>
      <label><input id="wire" type="checkbox" /> Wireframe</label>
      <label><input id="shadow" type="checkbox" checked /> Ground shadow</label>
      <div id="time"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
