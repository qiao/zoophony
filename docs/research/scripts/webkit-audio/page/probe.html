<!doctype html>
<meta charset="utf-8" />
<title>Worklet probe</title>
<button id="go">Start</button>
<!--
  Query: iters=<n> (work of each block), osc=1 (an OscillatorNode and no worklet),
  hint=<latencyHint>. The page samples performance.now() and currentTime each 200 ms.
-->
<script type="module">
  const params = new URLSearchParams(location.search);
  const hint = params.get('hint') ?? 'interactive';
  window.probe = { state: 'init', stats: null, samples: [] };
  document.getElementById('go').onclick = async () => {
    const ctx = new AudioContext({ latencyHint: /^[0-9.]+$/.test(hint) ? Number(hint) : hint });
    if (params.has('osc')) {
      const osc = new OscillatorNode(ctx, { frequency: 440 });
      osc.connect(new GainNode(ctx, { gain: 1e-4 })).connect(ctx.destination);
      osc.start();
    } else {
      await ctx.audioWorklet.addModule('probe-processor.js');
      const node = new AudioWorkletNode(ctx, 'probe', {
        numberOfInputs: 0,
        outputChannelCount: [2],
        processorOptions: { iters: Number(params.get('iters') ?? 0) },
      });
      node.connect(ctx.destination);
      node.port.onmessage = (event) => (window.probe.stats = event.data);
    }
    await ctx.resume();
    startSampling(ctx);
  };

  function startSampling(ctx) {
    window.probe.state = 'running';
    window.probe.ctx = { sampleRate: ctx.sampleRate, baseLatency: ctx.baseLatency };
    const t0 = performance.now();
    const c0 = ctx.currentTime;
    setInterval(() => {
      window.probe.samples.push([performance.now() - t0, ctx.currentTime - c0]);
      window.probe.ctx.outputLatency = ctx.outputLatency;
      const stats = ctx.playbackStats;
      if (stats) {
        window.probe.playback = { underrunEvents: stats.underrunEvents, underrunDuration: stats.underrunDuration };
      }
    }, 200);
  }
  window.startSampling = startSampling;
</script>
