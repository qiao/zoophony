<!doctype html>
<meta charset="utf-8" />
<title>Synth probe</title>
<button id="go">Start</button>
<!--
  Plays demo 1 with SynthEngine in synth-probe.js. Query: effects=0, interp=<0|1|2>,
  idle=<n> (square roots and a quiet tone in place of the synth), hint=<latencyHint>.
-->
<script type="module">
  const params = new URLSearchParams(location.search);
  const options = {};
  if (params.has('effects')) options.effects = params.get('effects') !== '0';
  if (params.has('interp')) options.interpolation = Number(params.get('interp'));
  if (params.has('idle')) options.idle = Number(params.get('idle'));
  const hint = params.get('hint') ?? 'interactive';
  window.probe = { state: 'init', stats: null, samples: [] };
  const score = await (await fetch('data/score.json')).json();
  const banks = await Promise.all(
    score.banks.map(async (bank) => ({
      id: bank.id,
      data: await (await fetch(`data/${bank.file}`)).arrayBuffer(),
    })),
  );
  document.getElementById('go').onclick = async () => {
    const ctx = new AudioContext({ latencyHint: /^[0-9.]+$/.test(hint) ? Number(hint) : hint });
    await ctx.audioWorklet.addModule('synth-probe.js');
    const node = new AudioWorkletNode(ctx, 'synth-probe', {
      numberOfInputs: 0,
      outputChannelCount: [2],
      processorOptions: options,
    });
    node.connect(ctx.destination);
    const ready = new Promise((resolve) => {
      node.port.onmessage = (event) => {
        if (event.data.ready) resolve();
        else window.probe.stats = event.data;
      };
    });
    const message = { events: score.events, durationSec: score.durationSec, banks };
    node.port.postMessage(message, banks.map((bank) => bank.data));
    await ctx.resume();
    await ready;
    window.probe.state = 'running';
    window.probe.ctx = { sampleRate: ctx.sampleRate, baseLatency: ctx.baseLatency };
    const t0 = performance.now();
    const c0 = ctx.currentTime;
    setInterval(() => {
      window.probe.samples.push([performance.now() - t0, ctx.currentTime - c0]);
      window.probe.ctx.outputLatency = ctx.outputLatency;
      const stats = ctx.playbackStats;
      if (stats) {
        window.probe.playback = { underrunEvents: stats.underrunEvents, underrunDuration: stats.underrunDuration };
      }
    }, 200);
  };
</script>
