# Deploys the site to GitHub Pages after CI passes on a push to main (design 9.2). The build uses
# the base path of the repository, and the smoke test checks the site under it before the deploy.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy that runs finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      ZOOPHONY_BASE: /zoophony/
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that CI checked. A manual run takes the commit of its branch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # All tests are paused (design 9.3). Remove each `if: false` to end the pause.
      - if: false
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - if: false
        run: pnpm test:e2e --project=chromium
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
