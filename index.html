<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The texts of search and share (design 7.4). The plugin INDEX_VALUES of vite.config.ts
         writes them from src/app/page-title.ts. The canonical URL names www in each build, also
         on GitHub Pages. The theme color is the dark edge of the page background (style.css). The
         alternate link names the Markdown copy of the page for agents (tools/site-pages.ts). -->
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="alternate" type="text/markdown" href="%SITE_URL%index.md" />
    <meta name="theme-color" content="#0b0908" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SHARE_IMAGE_URL%" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="%SHARE_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%SHARE_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="%SHARE_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">%WEB_APPLICATION%</script>
    <!-- The file of the default demo loads with the scripts, so the stage can show it sooner
         (design 7.2). The fetch of src/app/app.ts then takes it from the preload. Its low
         priority keeps the scripts first. It starts after the first contentful paint, because a
         request that ends before that paint adds to the LCP that Lighthouse simulates. A hash
         that names a demo opens that demo (design 2.2), so the page preloads nothing. -->
    <script>
      if (!new URLSearchParams(location.hash.slice(1)).has('demo')) {
        const preload = () => {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.fetchPriority = 'low';
          link.href = '%DEFAULT_DEMO_URL%';
          document.head.append(link);
        };
        if (PerformanceObserver.supportedEntryTypes.includes('paint')) {
          new PerformanceObserver((list, observer) => {
            if (list.getEntriesByName('first-contentful-paint').length > 0) {
              observer.disconnect();
              preload();
            }
          }).observe({ type: 'paint', buffered: true });
        } else {
          preload();
        }
      }
    </script>
    <!-- The style sheets load before the first paint, in the dev server and in the build, so the
         first paint is dark and shows the styled load state (design 2.8). An import in the
         script loaded them only after the script ran: a white page with a black disc. The build
         puts them inline (INLINE_CSS of vite.config.ts, design 7.2). -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/ui.css" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="An orchestra of animals on a stage"></canvas>

      </div>
      <h2>%DEFAULT_DEMO_TITLE%</h2>
      <p>%DEFAULT_DEMO_COMPOSER%</p>
    </header>
    <!-- A hash that names a demo opens that demo (design 2.2), and the app writes its title. -->
    <script>
      if (new URLSearchParams(location.hash.slice(1)).has('demo')) {
        for (const line of document.querySelectorAll('.title h2, .title p')) {
          line.textContent = '';
        }
      }
    </script>
    <!-- The load state before the script runs (design 2.8). It uses the classes of ui.css, which
         the head links, and src/main.ts removes it. -->
    <div class="first-screen is-pending boot">
      <div class="boot-slot">
        <svg class="ring" viewBox="0 0 84 84" aria-hidden="true">
          <circle class="track" cx="42" cy="42" r="40" />
          <circle
            class="done"
            cx="42"
            cy="42"
            r="40"
            stroke-dasharray="251.3"
            stroke-dashoffset="213.6"
          />
        </svg>
      </div>
      <div class="status" aria-live="polite">Loading</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
