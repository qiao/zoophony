<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoophony</title>
    <meta
      name="description"
      content="An orchestra of animals plays your MIDI file in the browser. Play a demo, or open a MIDI file of your own."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Zoophony" />
    <meta
      property="og:description"
      content="An orchestra of animals plays your MIDI file in the browser. Play a demo, or open a MIDI file of your own."
    />
    <meta property="og:type" content="website" />
    <!-- The file of the default demo loads with the scripts, so the stage can show it sooner
         (design 7.2). The fetch of src/app/app.ts then takes it from the preload. Its low
         priority keeps the scripts first. A hash that names a demo opens that demo (design 2.2),
         so the page preloads nothing. -->
    <script>
      if (!new URLSearchParams(location.hash.slice(1)).has('demo')) {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.fetchPriority = 'low';
        link.href = '%DEFAULT_DEMO_URL%';
        document.head.append(link);
      }
    </script>
    <!-- The style sheets load before the first paint, in the dev server and in the build, so the
         first paint is dark and shows the styled load state (design 2.8). An import in the
         script loaded them only after the script ran: a white page with a black disc. -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/ui.css" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="An orchestra of animals on a stage"></canvas>
    <!-- The load state before the script runs (design 2.8). It uses the classes of ui.css, which
         the head links, and src/main.ts removes it. -->
    <header class="title boot">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="4.8" cy="10.6" rx="2.1" ry="2.7" transform="rotate(-24 4.8 10.6)"/><ellipse cx="9.3" cy="5.6" rx="2.2" ry="2.9" transform="rotate(-8 9.3 5.6)"/><ellipse cx="14.7" cy="5.6" rx="2.2" ry="2.9" transform="rotate(8 14.7 5.6)"/><ellipse cx="19.2" cy="10.6" rx="2.1" ry="2.7" transform="rotate(24 19.2 10.6)"/><path d="M12 11.6c-3.4 0-6.6 3.7-6.6 6.6 0 1.9 1.5 3 3.2 3 1.4 0 2.3-.7 3.4-.7s2 .7 3.4.7c1.7 0 3.2-1.1 3.2-3 0-2.9-3.2-6.6-6.6-6.6z"/></svg><span>Zoophony</span>
      </div>
    </header>
    <div class="first-screen is-pending boot">
      <div class="boot-slot">
        <svg class="ring" viewBox="0 0 84 84" aria-hidden="true">
          <circle class="track" cx="42" cy="42" r="40" />
          <circle
            class="done"
            cx="42"
            cy="42"
            r="40"
            stroke-dasharray="251.3"
            stroke-dashoffset="213.6"
          />
        </svg>
      </div>
      <div class="status" aria-live="polite">Loading</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
